# Catane Gather V1 Configuration
spring.application.name=gather
server.port=${PORT:${SERVER_PORT:8080}}

# Database Configuration (Supplied strictly via environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}

# File Upload Limit
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB

# Catane Gather Product Settings
gather.pricing.price-in-inr=99
gather.jwt.secret=${JWT_SECRET}
gather.jwt.expiration-ms=86400000
gather.upload.dir=./uploads
gather.upload.base-url=${UPLOAD_BASE_URL:}

# Razorpay Payment Gateway & Webhook Credentials
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:${RAZORPAY_KEY_SECRET:}}

# SMTP Email Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
gather.mail.from=${MAIL_FROM:noreply@catanegather.com}
gather.mail.sender-name=${MAIL_SENDER_NAME:Catane Gather}

# Brevo Email Configuration (HTTPS Port 443 - Sends to ANY recipient without domain)
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:sudharsannotout@gmail.com}

# Resend Email Configuration (HTTPS Port 443 - Bypasses cloud SMTP port blocks)
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:Catane Gather <onboarding@resend.dev>}


